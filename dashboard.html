<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>AI Meal Planner</title>

  <link rel="stylesheet"
        href="/static/style.css">

</head>

<body>

  <!-- NAVBAR -->

  <div class="navbar">

    <h2>AI Meal Planner</h2>

    <button onclick="logout()">
      Logout
    </button>

  </div>

  <!-- CONTAINER -->

  <div class="container">

    <!-- MEAL PLAN -->

    <div class="card">

      <h2>Generate Meal Plan</h2>

      <input type="text"
             id="userName"
             placeholder="Enter Name">

      <input type="number"
             id="weight"
             placeholder="Enter Weight">

      <input type="number"
             id="height"
             placeholder="Enter Height">

      <!-- GOAL -->

      <select id="goal">

        <option value="">
          Select Goal
        </option>

        <option value="Weight Loss">
          Weight Loss
        </option>

        <option value="Weight Gain">
          Weight Gain
        </option>

        <option value="Maintain Weight">
          Maintain Weight
        </option>

      </select>

      <!-- DIET -->

      <select id="diet">

        <option value="">
          Select Diet
        </option>

        <option value="Vegetarian">
          Vegetarian
        </option>

        <option value="Non-Vegetarian">
          Non-Vegetarian
        </option>

      </select>

      <button onclick="generatePlan()">
        Generate Plan
      </button>

      <!-- RESULT -->

      <div id="result"></div>

    </div>

    <!-- CHATBOT -->

    <div class="card">

      <h2>AI Chatbot</h2>

      <div class="chat-box"
           id="chatBox"></div>

      <input type="text"
             id="chatInput"
             placeholder="Ask anything">

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>

  <script src="/static/script.js"></script>

</body>
</html>
